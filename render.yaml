services:
  - type: web
    name: mushguard
    runtime: python
    plan: free
    buildCommand: "bash build.sh"
    startCommand: "bash start.sh"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "mushguard.onrender.com"
      - key: WEB_CONCURRENCY
        value: "2"
      # Secrets below: set the values in the Render dashboard, never in this file
      - key: DATABASE_URL           # Supabase > Connect > Session pooler URI
        sync: false
      - key: SUPABASE_PROJECT_REF   # the <ref> in https://<ref>.supabase.co
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: "media"
      - key: SUPABASE_S3_REGION     # Supabase > Storage > S3 Configuration
        sync: false
      - key: SUPABASE_S3_ACCESS_KEY_ID
        sync: false
      - key: SUPABASE_S3_SECRET_ACCESS_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
